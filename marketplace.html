<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Dhive</title>
    <!-- Same styles as index.html -->
</head>
<body>
    <!-- Same header as index.html -->

    <div class="container">
        <div class="marketplace-header">
            <h1>Digital Products Marketplace</h1>
            <p>Browse and purchase digital products from creators worldwide. No account required to shop!</p>
        </div>

        <div class="products-grid">
            <!-- Products will be loaded here -->
            <div class="product-card">
                <div class="product-image">
                    <i class="fas fa-book"></i>
                </div>
                <div class="product-info">
                    <h3>Digital Marketing Guide</h3>
                    <p>Complete guide to digital marketing strategies</p>
                    <div class="product-price">R149.00</div>
                    <button class="btn btn-primary" onclick="addToCart(1)">
                        <i class="fas fa-cart-plus"></i> Add to Cart
                    </button>
                </div>
            </div>
            <!-- More products... -->
        </div>
    </div>

    <script>
        // Marketplace specific functionality
        function addToCart(productId) {
            let cart = JSON.parse(localStorage.getItem('dhive_cart')) || [];
            cart.push({
                id: productId,
                addedAt: new Date().toISOString()
            });
            localStorage.setItem('dhive_cart', JSON.stringify(cart));
            showNotification('Product added to cart!', 'success');
        }
    </script>
</body>
</html>
