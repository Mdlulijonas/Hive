<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Portal - Dhive</title>
    <!-- Same styles as index.html -->
</head>
<body>
    <!-- Same header as index.html -->

    <div class="container">
        <div class="seller-portal">
            <!-- Authentication Required Message -->
            <div id="authRequired" class="seller-auth-section" style="display: none;">
                <h2>Authentication Required</h2>
                <p>You must be logged in and have a seller account to access the seller portal.</p>
                <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
                    <a href="dashboard.html" class="btn btn-success">
                        <i class="fas fa-sign-in-alt"></i> Go to Dashboard
                    </a>
                    <a href="index.html" class="btn btn-outline">
                        <i class="fas fa-home"></i> Return to Home
                    </a>
                </div>
            </div>

            <!-- Seller Dashboard (Only shown when authenticated) -->
            <div id="sellerDashboard" style="display: none;">
                <h1>Seller Dashboard</h1>
                <!-- Seller content here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkSellerAuth();
        });

        function checkSellerAuth() {
            const user = JSON.parse(localStorage.getItem('dhive_user'));
            
            if (!user) {
                document.getElementById('authRequired').style.display = 'block';
                return;
            }
            
            if (!user.isSeller) {
                document.getElementById('authRequired').innerHTML = `
                    <h2>Seller Account Required</h2>
                    <p>You need a seller account to access the seller portal.</p>
                    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
                        <button class="btn btn-success" onclick="createSellerAccount()">
                            <i class="fas fa-store"></i> Create Seller Account
                        </button>
                        <a href="dashboard.html" class="btn btn-outline">
                            <i class="fas fa-sign-in-alt"></i> Go to Dashboard
                        </a>
                    </div>
                `;
                document.getElementById('authRequired').style.display = 'block';
                return;
            }
            
            // User is authenticated and has seller account
            document.getElementById('sellerDashboard').style.display = 'block';
        }

        function createSellerAccount() {
            if (!currentUser) {
                showNotification('Please login first', 'warning');
                openModal('loginModal');
                return;
            }
            
            // Update user to seller
            currentUser.isSeller = true;
            localStorage.setItem('dhive_user', JSON.stringify(currentUser));
            
            showNotification('Seller account created successfully!', 'success');
            window.location.reload();
        }
    </script>
</body>
</html>
