<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Content - Dhive</title>
    <!-- Same styles as index.html with video enhancements -->
</head>
<body>
    <!-- Same header as index.html -->

    <div class="container">
        <!-- Video Player -->
        <div class="video-player">
            <video id="mainVideo" controls>
                <source src="#" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <div class="video-info">
                <h2 id="videoTitle">Video Title</h2>
                <div class="video-stats">
                    <span id="viewCount">0 views</span>
                    • 
                    <span id="uploadDate">Just now</span>
                </div>
                
                <div class="video-actions">
                    <button class="video-action-btn" onclick="toggleLike()">
                        <i class="far fa-thumbs-up"></i>
                        <span id="likeCount">0</span>
                    </button>
                    
                    <button class="video-action-btn" onclick="toggleCommentSection()">
                        <i class="far fa-comment"></i>
                        <span id="commentCount">0</span>
                    </button>
                    
                    <button class="video-action-btn" onclick="shareVideo()">
                        <i class="fas fa-share"></i> Share
                    </button>
                    
                    <button class="video-action-btn" onclick="toggleSave()">
                        <i class="far fa-bookmark"></i> Save
                    </button>
                    
                    <button class="video-action-btn btn-primary" onclick="openTipModal()">
                        <i class="fas fa-heart"></i> Tip Creator
                    </button>
                </div>
                
                <!-- Comment Section -->
                <div class="comment-section" id="commentSection" style="display: none;">
                    <h3>Comments</h3>
                    <div class="comments-list" id="commentsList">
                        <!-- Comments will be loaded here -->
                    </div>
                    <div class="comment-form">
                        <textarea placeholder="Add a comment..." id="commentInput"></textarea>
                        <button class="btn btn-primary" onclick="postComment()">Post</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tip Modal -->
    <div class="modal" id="tipModal">
        <div class="modal-content">
            <h2>Tip the Creator</h2>
            <p>Minimum tip amount: R1</p>
            
            <div class="tip-options">
                <button class="tip-option" onclick="selectTipAmount(1)">R1</button>
                <button class="tip-option" onclick="selectTipAmount(5)">R5</button>
                <button class="tip-option" onclick="selectTipAmount(10)">R10</button>
                <button class="tip-option" onclick="selectTipAmount(20)">R20</button>
                <button class="tip-option" onclick="selectTipAmount(50)">R50</button>
            </div>
            
            <div class="custom-tip">
                <input type="number" id="customTipAmount" placeholder="Custom amount" min="1" step="0.01">
                <button class="btn btn-primary" onclick="processCustomTip()">Custom Amount</button>
            </div>
            
            <div class="payment-methods">
                <h4>Payment Methods:</h4>
                <button class="btn btn-outline" onclick="processCardPayment()">
                    <i class="fas fa-credit-card"></i> Card Payment
                </button>
                <button class="btn btn-outline" onclick="processDigicoinPayment()">
                    <i class="fas fa-coins"></i> Digi-Coins
                </button>
            </div>
            
            <button class="btn btn-primary" onclick="sendTip()">Send Tip</button>
        </div>
    </div>

    <script>
        // Video Player Functionality
        let currentVideo = {
            id: 1,
            title: "Sample Video",
            views: 1250,
            likes: 89,
            comments: [],
            isLiked: false,
            isSaved: false
        };

        let selectedTipAmount = 0;

        function toggleLike() {
            if (!currentUser) {
                showNotification('Please login to like videos', 'warning');
                openModal('loginModal');
                return;
            }
            
            currentVideo.isLiked = !currentVideo.isLiked;
            currentVideo.likes += currentVideo.isLiked ? 1 : -1;
            
            document.querySelector('.video-action-btn .fa-thumbs-up').className = 
                currentVideo.isLiked ? 'fas fa-thumbs-up' : 'far fa-thumbs-up';
            document.getElementById('likeCount').textContent = currentVideo.likes;
        }

        function toggleSave() {
            if (!currentUser) {
                showNotification('Please login to save videos', 'warning');
                openModal('loginModal');
                return;
            }
            
            currentVideo.isSaved = !currentVideo.isSaved;
            
            document.querySelector('.video-action-btn .fa-bookmark').className = 
                currentVideo.isSaved ? 'fas fa-bookmark' : 'far fa-bookmark';
            
            showNotification(currentVideo.isSaved ? 'Video saved!' : 'Video removed from saved', 'info');
        }

        function toggleCommentSection() {
            const section = document.getElementById('commentSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        function postComment() {
            if (!currentUser) {
                showNotification('Please login to comment', 'warning');
                openModal('loginModal');
                return;
            }
            
            const commentInput = document.getElementById('commentInput');
            const comment = commentInput.value.trim();
            
            if (!comment) {
                showNotification('Please enter a comment', 'warning');
                return;
            }
            
            // Add comment to list
            const commentElement = document.createElement('div');
            commentElement.className = 'comment';
            commentElement.innerHTML = `
                <div class="comment-author">${currentUser.name}</div>
                <div class="comment-text">${comment}</div>
                <div class="comment-time">Just now</div>
            `;
            
            document.getElementById('commentsList').appendChild(commentElement);
            commentInput.value = '';
            
            // Update count
            const commentCount = document.getElementById('commentCount');
            commentCount.textContent = parseInt(commentCount.textContent) + 1;
        }

        function openTipModal() {
            if (!currentUser) {
                showNotification('Please login to tip creators', 'warning');
                openModal('loginModal');
                return;
            }
            
            openModal('tipModal');
        }

        function selectTipAmount(amount) {
            selectedTipAmount = amount;
            document.querySelectorAll('.tip-option').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function processCustomTip() {
            const amount = parseFloat(document.getElementById('customTipAmount').value);
            if (amount >= 1) {
                selectedTipAmount = amount;
                showNotification(`Tip amount set to R${amount.toFixed(2)}`, 'info');
            } else {
                showNotification('Minimum tip amount is R1', 'warning');
            }
        }

        async function sendTip() {
            if (selectedTipAmount < 1) {
                showNotification('Minimum tip amount is R1', 'warning');
                return;
            }
            
            showNotification(`Processing R${selectedTipAmount.toFixed(2)} tip...`, 'info');
            
            // Simulate payment processing
            setTimeout(() => {
                showNotification(`Tip of R${selectedTipAmount.toFixed(2)} sent successfully!`, 'success');
                closeModal('tipModal');
                selectedTipAmount = 0;
            }, 2000);
        }

        function processCardPayment() {
            showNotification('Redirecting to card payment...', 'info');
            // In production, integrate with payment gateway
        }

        function processDigicoinPayment() {
            if (!currentUser) return;
            
            showNotification('Processing Digi-Coin payment...', 'info');
            // In production, deduct from user's Digi-Coin balance
        }

        function shareVideo() {
            const shareUrl = window.location.href;
            
            if (navigator.share) {
                navigator.share({
                    title: currentVideo.title,
                    text: 'Check out this video on Dhive',
                    url: shareUrl
                });
            } else {
                navigator.clipboard.writeText(shareUrl)
                    .then(() => showNotification('Link copied to clipboard!', 'success'));
            }
        }

        // Update view count
        document.getElementById('mainVideo').addEventListener('play', function() {
            currentVideo.views++;
            document.getElementById('viewCount').textContent = currentVideo.views + ' views';
        });
    </script>
</body>
</html>
